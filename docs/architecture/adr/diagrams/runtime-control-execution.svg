<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">WorkExpert 控制面与执行面</title><desc id="desc">控制面、执行面和事件反馈环路。</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#475569"/></marker><style>.h{font:700 27px system-ui;fill:#172554}.t{font:700 18px system-ui;fill:#1e293b}.s{font:14px system-ui;fill:#475569}.box{fill:#fff;stroke-width:2;rx:14}.line{stroke:#475569;stroke-width:2.2;fill:none;marker-end:url(#a)}.dash{stroke-dasharray:8 6}</style></defs>
  <rect width="1200" height="700" fill="#f8fafc"/><text x="50" y="48" class="h">运行时：控制面与执行面</text>
  <rect x="45" y="85" width="510" height="550" rx="22" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/><text x="70" y="120" class="t">控制面（API / Orchestrator）</text>
  <rect x="645" y="85" width="510" height="550" rx="22" fill="#fff7ed" stroke="#f97316" stroke-width="2"/><text x="670" y="120" class="t">执行面（Agent Core / Sidecars）</text>
  <g class="s">
    <rect x="90" y="155" width="190" height="72" class="box" stroke="#818cf8"/><text x="185" y="185" text-anchor="middle">Auth + Context</text><text x="185" y="207" text-anchor="middle">身份与可信上下文</text>
    <rect x="320" y="155" width="190" height="72" class="box" stroke="#818cf8"/><text x="415" y="185" text-anchor="middle">Dispatcher</text><text x="415" y="207" text-anchor="middle">容量、队列与优先级</text>
    <rect x="90" y="270" width="190" height="72" class="box" stroke="#818cf8"/><text x="185" y="300" text-anchor="middle">Run State</text><text x="185" y="322" text-anchor="middle">终态、审批、续跑</text>
    <rect x="320" y="270" width="190" height="72" class="box" stroke="#818cf8"/><text x="415" y="300" text-anchor="middle">Project DAG</text><text x="415" y="322" text-anchor="middle">Plan / ChangeSet</text>
    <rect x="90" y="385" width="420" height="72" class="box" stroke="#818cf8"/><text x="300" y="415" text-anchor="middle">Domain Repository（唯一写者）</text><text x="300" y="437" text-anchor="middle">session · run · project · approval · task</text>
    <rect x="90" y="500" width="420" height="72" class="box" stroke="#818cf8"/><text x="300" y="530" text-anchor="middle">OrcEvent / SSE / Runtime Status</text><text x="300" y="552" text-anchor="middle">对客户端与运维暴露可观测状态</text>

    <rect x="690" y="155" width="190" height="72" class="box" stroke="#fb923c"/><text x="785" y="185" text-anchor="middle">Agent Loop</text><text x="785" y="207" text-anchor="middle">规划、模型与工具选择</text>
    <rect x="920" y="155" width="190" height="72" class="box" stroke="#fb923c"/><text x="1015" y="185" text-anchor="middle">Capability Router</text><text x="1015" y="207" text-anchor="middle">专业模型路由</text>
    <rect x="690" y="270" width="190" height="72" class="box" stroke="#fb923c"/><text x="785" y="300" text-anchor="middle">Tools / Skills / MCP</text><text x="785" y="322" text-anchor="middle">策略与审批执行点</text>
    <rect x="920" y="270" width="190" height="72" class="box" stroke="#fb923c"/><text x="1015" y="300" text-anchor="middle">Backend Registry</text><text x="1015" y="322" text-anchor="middle">pi / AgentScope / dsh</text>
    <rect x="690" y="385" width="420" height="72" class="box" stroke="#fb923c"/><text x="900" y="415" text-anchor="middle">Sidecar Pool / External Providers</text><text x="900" y="437" text-anchor="middle">进程隔离、健康、摘除、恢复</text>
    <rect x="690" y="500" width="420" height="72" class="box" stroke="#fb923c"/><text x="900" y="530" text-anchor="middle">AgentEvent</text><text x="900" y="552" text-anchor="middle">delta · tool · capability · artifact · usage · terminal</text>
  </g>
  <path d="M510 191H690" class="line"/><text x="600" y="178" text-anchor="middle" class="s">RunRequest</text>
  <path d="M690 536H545" class="line"/><text x="615" y="523" text-anchor="middle" class="s">events</text>
  <path d="M555 606H645" class="line dash"/><text x="600" y="595" text-anchor="middle" class="s">进程 / 信任边界</text>
</svg>
