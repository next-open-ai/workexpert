<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">WorkExpert 逻辑分层架构</title>
  <desc id="desc">从入口体验层到平台基础层的六层架构及单向依赖。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7f8ff"/><stop offset="1" stop-color="#eef7ff"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker>
    <style>.h{font:700 27px system-ui,sans-serif;fill:#172554}.t{font:600 18px system-ui,sans-serif;fill:#1e293b}.s{font:14px system-ui,sans-serif;fill:#475569}.layer{stroke-width:2;rx:16}.chip{fill:#fff;stroke:#cbd5e1;rx:10}.arrow{stroke:#475569;stroke-width:2.2;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1200" height="760" fill="url(#bg)"/>
  <text x="52" y="46" class="h">WorkExpert 逻辑分层架构</text>
  <text x="52" y="72" class="s">依赖自上而下；公共契约与安全规则贯穿所有层</text>

  <g transform="translate(70 100)">
    <rect width="1060" height="82" class="layer" fill="#e0e7ff" stroke="#6366f1"/><text x="24" y="30" class="t">L1 · 入口与体验层</text>
    <rect x="250" y="18" width="170" height="46" class="chip"/><text x="335" y="47" text-anchor="middle" class="s">Vue Renderer</text>
    <rect x="438" y="18" width="170" height="46" class="chip"/><text x="523" y="47" text-anchor="middle" class="s">Web Browser</text>
    <rect x="626" y="18" width="170" height="46" class="chip"/><text x="711" y="47" text-anchor="middle" class="s">Telegram / 飞书</text>
    <rect x="814" y="18" width="170" height="46" class="chip"/><text x="899" y="47" text-anchor="middle" class="s">Relay Client</text>
  </g>
  <line x1="600" y1="182" x2="600" y2="208" class="arrow"/>
  <g transform="translate(70 210)">
    <rect width="1060" height="82" class="layer" fill="#dbeafe" stroke="#3b82f6"/><text x="24" y="30" class="t">L2 · 接入与服务层</text>
    <rect x="310" y="18" width="210" height="46" class="chip"/><text x="415" y="47" text-anchor="middle" class="s">Fastify API + Auth</text>
    <rect x="540" y="18" width="210" height="46" class="chip"/><text x="645" y="47" text-anchor="middle" class="s">Gateway + Channel</text>
    <rect x="770" y="18" width="210" height="46" class="chip"/><text x="875" y="47" text-anchor="middle" class="s">Desktop IPC / Preload</text>
  </g>
  <line x1="600" y1="292" x2="600" y2="318" class="arrow"/>
  <g transform="translate(70 320)">
    <rect width="1060" height="82" class="layer" fill="#dcfce7" stroke="#22c55e"/><text x="24" y="30" class="t">L3 · 业务编排层</text>
    <rect x="300" y="18" width="220" height="46" class="chip"/><text x="410" y="47" text-anchor="middle" class="s">Session / Run / Approval</text>
    <rect x="540" y="18" width="220" height="46" class="chip"/><text x="650" y="47" text-anchor="middle" class="s">Project DAG / ChangeSet</text>
    <rect x="780" y="18" width="200" height="46" class="chip"/><text x="880" y="47" text-anchor="middle" class="s">Durable Task</text>
  </g>
  <line x1="600" y1="402" x2="600" y2="428" class="arrow"/>
  <g transform="translate(70 430)">
    <rect width="1060" height="82" class="layer" fill="#fef3c7" stroke="#f59e0b"/><text x="24" y="30" class="t">L4 · Agent 与能力执行层</text>
    <rect x="270" y="18" width="190" height="46" class="chip"/><text x="365" y="47" text-anchor="middle" class="s">Agent Core</text>
    <rect x="480" y="18" width="190" height="46" class="chip"/><text x="575" y="47" text-anchor="middle" class="s">Skills / Tools / MCP</text>
    <rect x="690" y="18" width="190" height="46" class="chip"/><text x="785" y="47" text-anchor="middle" class="s">Capability Models</text>
    <rect x="900" y="18" width="110" height="46" class="chip"/><text x="955" y="47" text-anchor="middle" class="s">pi</text>
  </g>
  <line x1="600" y1="512" x2="600" y2="538" class="arrow"/>
  <g transform="translate(70 540)">
    <rect width="1060" height="82" class="layer" fill="#fae8ff" stroke="#a855f7"/><text x="24" y="30" class="t">L5 · 执行后端与集成层</text>
    <rect x="300" y="18" width="200" height="46" class="chip"/><text x="400" y="47" text-anchor="middle" class="s">AgentScope Sidecar</text>
    <rect x="520" y="18" width="160" height="46" class="chip"/><text x="600" y="47" text-anchor="middle" class="s">dsh Sidecar</text>
    <rect x="700" y="18" width="150" height="46" class="chip"/><text x="775" y="47" text-anchor="middle" class="s">Providers</text>
    <rect x="870" y="18" width="140" height="46" class="chip"/><text x="940" y="47" text-anchor="middle" class="s">Search</text>
  </g>
  <line x1="600" y1="622" x2="600" y2="648" class="arrow"/>
  <g transform="translate(70 650)">
    <rect width="1060" height="70" class="layer" fill="#f1f5f9" stroke="#64748b"/><text x="24" y="28" class="t">L6 · 平台基础层</text>
    <text x="300" y="44" class="s">Contracts · Storage · SQLite · LanceDB · Immutable Files · Observability</text>
  </g>
</svg>
