<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">WorkExpert 数据与安全分层</title><desc id="desc">客户端、可信服务、权威存储和外部服务的信任边界。</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#475569"/></marker><style>.h{font:700 27px system-ui;fill:#172554}.t{font:700 17px system-ui;fill:#1e293b}.s{font:14px system-ui;fill:#475569}.box{fill:#fff;stroke-width:2;rx:13}.line{stroke:#475569;stroke-width:2;fill:none;marker-end:url(#a)}.deny{stroke:#dc2626;stroke-width:3}.zone{stroke-dasharray:10 7;stroke-width:2;rx:20}</style></defs>
  <rect width="1200" height="720" fill="#f8fafc"/><text x="48" y="46" class="h">数据与安全分层</text>
  <rect x="45" y="80" width="1110" height="120" class="zone" fill="#f1f5f9" stroke="#94a3b8"/><text x="68" y="110" class="t">非可信客户端区</text>
  <rect x="170" y="125" width="210" height="50" class="box" stroke="#94a3b8"/><text x="275" y="156" text-anchor="middle" class="s">Renderer / Web</text>
  <rect x="490" y="125" width="210" height="50" class="box" stroke="#94a3b8"/><text x="595" y="156" text-anchor="middle" class="s">IM / Relay Client</text>
  <rect x="810" y="125" width="210" height="50" class="box" stroke="#94a3b8"/><text x="915" y="156" text-anchor="middle" class="s">CLI / Data App Client</text>

  <rect x="45" y="235" width="1110" height="205" class="zone" fill="#ecfdf5" stroke="#10b981"/><text x="68" y="266" class="t">可信服务区</text>
  <rect x="100" y="295" width="210" height="72" class="box" stroke="#10b981"/><text x="205" y="325" text-anchor="middle" class="s">Electron Main</text><text x="205" y="347" text-anchor="middle" class="s">safeStorage / IPC</text>
  <rect x="365" y="295" width="210" height="72" class="box" stroke="#10b981"/><text x="470" y="325" text-anchor="middle" class="s">API + Auth Guard</text><text x="470" y="347" text-anchor="middle" class="s">身份与路径解析</text>
  <rect x="630" y="295" width="210" height="72" class="box" stroke="#10b981"/><text x="735" y="325" text-anchor="middle" class="s">Orchestrator</text><text x="735" y="347" text-anchor="middle" class="s">Domain 单写者</text>
  <rect x="895" y="295" width="210" height="72" class="box" stroke="#10b981"/><text x="1000" y="325" text-anchor="middle" class="s">Agent Core</text><text x="1000" y="347" text-anchor="middle" class="s">唯一模型调用层</text>

  <rect x="45" y="475" width="1110" height="155" class="zone" fill="#eff6ff" stroke="#3b82f6"/><text x="68" y="506" class="t">本机权威数据区</text>
  <rect x="100" y="535" width="190" height="60" class="box" stroke="#3b82f6"/><text x="195" y="561" text-anchor="middle" class="s">Secrets / Keyring</text><text x="195" y="581" text-anchor="middle" class="s">密钥</text>
  <rect x="330" y="535" width="190" height="60" class="box" stroke="#3b82f6"/><text x="425" y="561" text-anchor="middle" class="s">Domain KV</text><text x="425" y="581" text-anchor="middle" class="s">会话与编排状态</text>
  <rect x="560" y="535" width="190" height="60" class="box" stroke="#3b82f6"/><text x="655" y="561" text-anchor="middle" class="s">Immutable Files</text><text x="655" y="581" text-anchor="middle" class="s">原文快照</text>
  <rect x="790" y="535" width="190" height="60" class="box" stroke="#3b82f6"/><text x="885" y="561" text-anchor="middle" class="s">SQLite</text><text x="885" y="581" text-anchor="middle" class="s">证据 / Wiki / FTS</text>
  <rect x="1000" y="535" width="115" height="60" class="box" stroke="#3b82f6"/><text x="1057" y="561" text-anchor="middle" class="s">LanceDB</text><text x="1057" y="581" text-anchor="middle" class="s">副本</text>

  <path d="M275 175V235" class="line"/><path d="M595 175V235" class="line"/><path d="M915 175V235" class="line"/>
  <path d="M205 367V535" class="line"/><path d="M735 367V535" class="line"/><path d="M1000 367C1000 440 885 455 885 535" class="line"/>
  <line x1="270" y1="205" x2="310" y2="225" class="deny"/><line x1="310" y1="205" x2="270" y2="225" class="deny"/><text x="325" y="220" class="s" fill="#dc2626">客户端禁止直读密钥/存储</text>
  <text x="48" y="680" class="s">授权规则：认证身份 + 保存配置 + 服务端 owner/path 解析；客户端字段仅作为请求，不作为授权事实。</text>
</svg>
